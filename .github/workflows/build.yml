name: Build

on:
  push:
    # 推 v* tag 才出包，避免每次提交都跑一遍完整打包
    tags:
      - 'v*'
  workflow_dispatch: {}   # 也允许在网页上手动跑一次（只在 tag 上才会建 Release）

jobs:
  build:
    runs-on: windows-latest

    # 默认 GITHUB_TOKEN 是只读的；Release 步骤要上传附件，必须显式给写权限
    permissions:
      contents: write

    env:
      PYTHONIOENCODING: 'UTF-8'

    strategy:
      matrix:
        python-version: [ 3.12 ]

    steps:
      - name: Configure git
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "353134935+TieLaa@users.noreply.github.com"
          git config --global user.name "TieLaa"

      - uses: actions/checkout@v4
        with:
          lfs: true
          # Release 说明要按「上一个 tag..当前 tag」生成，必须拉全历史和 tag；
          # 默认 fetch-depth: 1 会让 git log 只剩 tag 那一个 commit。
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set UTF-8 encoding
        run: |
          set PYTHONIOENCODING=utf-8
          set PYTHONLEGACYWINDOWSSTDIO=utf-8
          echo PYTHONIOENCODING=utf-8 >> $GITHUB_ENV

      # requirements.txt 是 pip-compile 生成的完整锁定文件（含 pyside6-essentials），
      # 所以必须 --no-deps，否则 PySide6-Fluent-Widgets 会把整个 PySide6 metapackage 拖进来。
      - name: Install dependencies
        run: |
          python -m pip install --no-deps -r requirements.txt

      - name: Run tests
        run: |
          $failed = $false
          Get-ChildItem -Path ".\tests\*.py" | ForEach-Object {
              Write-Host "Running tests in $($_.FullName)"
              python -m unittest $_.FullName
              if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

      # 模板里写的是「GitHub Action 会自动改 version」，但 pyappify-action 只吃 tag，
      # 不会回写 src/config.py。不补这一步，打出来的包「关于」页会显示 dev。
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import os, pathlib, re
          tag = os.environ['GITHUB_REF_NAME'].lstrip('v')
          path = pathlib.Path('src/config.py')
          text = path.read_text(encoding='utf-8')
          new_text, count = re.subn(r'^version = ".*"$', f'version = "{tag}"', text, count=1, flags=re.M)
          if count != 1:
              raise SystemExit(f'failed to stamp version, matches={count}')
          path.write_text(new_text, encoding='utf-8')
          print(f'version stamped: {tag}')

      # 钉到 commit（2026-11-09 的 master），不用 @master 以免上游改动直接影响发布
      - name: Build with PyAppify Action
        id: build-app
        uses: ok-oldking/pyappify-action@33534434fc01d51039285d3f0c9bd3ab4d952bea
        with:
          # v1.2.7 起启动器会读应用仓库里的 CHANGELOG.md 显示更新内容（v1.2.4 只读提交信息）。
          # CHANGELOG.md 已在 deploy.txt 里，随同步进更新仓库。
          version: 'v1.2.7'

      # Release 正文 = 安装说明模板 + 「上一个 tag..当前 tag」里用户可见的提交。
      # 提交信息按 AGENTS.md 的「写给用户看」口径写；这里再兜底过滤内部前缀，
      # 并去掉 feat(ui): / fix(training): 这类前缀，避免原样漏到用户面前。
      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $prev = git describe --tags --abbrev=0 "$tag^" 2>$null
          if (-not $prev) { $prev = git rev-list --max-parents=0 HEAD }
          # 先让 git 直接写 UTF-8 文件，再用 Get-Content -Encoding utf8 读；
          # 不要用管道接 git 输出：PowerShell 会按控制台码页解码，中文会被改写成乱码。
          $raw = Join-Path $env:RUNNER_TEMP 'raw_changes.txt'
          git log --no-merges --pretty=format:'- %s' "$prev..$tag" "--output=$raw"
          $changes = Get-Content -LiteralPath $raw -Encoding utf8
          $changes = $changes | Where-Object {
            $_ -notmatch '^- (tests?|ci|refactor|chore|build|docs)(\(|:)' -and
            $_ -notmatch '^- [a-z]+\((tools|evidence|release|tests?|ci|build|docs)\)' -and
            $_ -notmatch '(README|Clean up duplicate|补充文档|发版后|发版说明|补充开发约定)'
          }
          $changes = $changes -replace '^- [a-z]+(\([^)]+\))?: ', '- '
          if (-not $changes) { $changes = @('- 本次以内部修复和打包调整为主') }
          $lines = @(
            "### 版本 $tag",
            "",
            "### 本次更新"
          ) + @($changes) + @(
            "",
            '### 老版本用户请重装安装包',
            '* 本版起「关于」页的更新内容改为显示真实改动条目（此前只显示 sync 和版本号），',
            '  这需要新版启动器支持，**已安装的旧版本不会自动升级启动器**。',
            '* 因此从 v0.1.13 及更早版本升级的用户，请**重新下载并安装**本版安装包，',
            '  重装后原有配置会保留。',
            '',
            '本页下方的安装包按更新源分两个 profile：',
            '* `China` —— 依赖走国内镜像，国内用户用这个',
            '* `Global` —— 依赖走 PyPI 官方源，海外用户用这个',
            "",
            '### 安装前请确认',
            '* **以管理员身份安装并运行**（游戏进程是管理员权限，非管理员发不进输入）',
            '* **安装路径必须是纯英文**（ok-script 拒绝非 ASCII 路径）',
            '* **游戏窗口必须保持可见**（完全遮挡或最小化时截图后端拿不到新帧）',
            "",
            '### 免责声明',
            '本项目与游戏官方无关，仅供学习交流。使用自动化工具可能违反游戏用户服务条款，存在封号风险，后果自负。'
          )
          $lines | Out-File -FilePath release_notes.md -Encoding utf8

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: false
          body_path: release_notes.md
          files: pyappify_dist/*
