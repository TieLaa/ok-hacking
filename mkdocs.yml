site_name: ok-hacking
site_description: ok-hacking —— 篮球少女：飞跃巅峰 养成自动化
repo_name: TieLaa/ok-hacking
repo_url: https://github.com/TieLaa/ok-hacking
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: readthedocs
  locale: zh_CN

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true

validation:
  nav:
    # docs/ 下还有大量历史文档（RUN_REPORT、research、roster 等）不在 nav 里，
    # 而 CI 用 `mkdocs build --strict`，这一项必须 ignore，否则构建直接失败。
    omitted_files: ignore
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

nav:
  - 首页: index.md
  - 工程文档:
      - 架构: ARCHITECTURE.md
      - 工程约定: ENGINEERING.md
      - 监控页: UI_MONITOR.md
      - 界面地图: UI_MAP.md
      - MCP 开发循环: MCP_DEV.md
      - 提示词手册: PROMPT_PLAYBOOK.md
      - 规则: RULES.md
  - 打包与发布: release.md
  - English:
      - Home: en/index.md
